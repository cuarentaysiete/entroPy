name: Build macOS App

# Manual: Actions tab -> "Build macOS App" -> "Run workflow".
# Produces a double-clickable .app as a downloadable artifact for both
# Apple Silicon and Intel Macs.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (arm64)
            arch: arm64
          - os: macos-13       # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build .app
        run: pyinstaller --noconfirm entroPy.spec

      - name: Bundle (zip)
        shell: bash
        run: cd dist && zip -qr "entroPy-macos-${{ matrix.arch }}.zip" entroPy.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: entroPy-macos-${{ matrix.arch }}
          path: dist/entroPy-macos-*.zip
