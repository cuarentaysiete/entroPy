name: Build macOS App

# Manual: Actions tab -> "Build macOS App" -> "Run workflow".
# Produces a double-clickable .app as a downloadable artifact (Apple Silicon).
#
# NOTE: only macos-latest (arm64) is built — GitHub retired the macos-13
# (Intel) runner label, so hosted x86_64 builds are no longer possible.
# Users on Intel Macs should build locally (see README).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build .app
        run: pyinstaller --noconfirm entroPy.spec

      - name: Bundle (zip)
        shell: bash
        # PyInstaller onedir layout: dist/entroPy/entroPy.app
        run: |
          cd dist/entroPy
          zip -qr "../entroPy-macos-arm64.zip" entroPy.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: entroPy-macos-arm64
          path: dist/entroPy-macos-arm64.zip
          retention-days: 30
